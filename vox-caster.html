<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vox-Caster</title>
<style>
  :root{
    --bg:#0b0908; --panel:#151011; --panel2:#1b1414; --line:#3a2523;
    --red:#c2372e; --red-dim:#7e241f; --brass:#d9a35b; --bone:#e8ddc9;
    --dim:#9b8d7a; --faint:#6b6055; --green:#9fb86a;
    --mono:ui-monospace,'SF Mono','Cascadia Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  button,input[type=range]{touch-action:manipulation;user-select:none;-webkit-user-select:none}
  html{font-size:16px}
  body{
    background:var(--bg); color:var(--bone); font-family:var(--mono);
    line-height:1.5; padding:16px 12px calc(30px + env(safe-area-inset-bottom));
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto}

  header{border:1px solid var(--line);background:var(--panel);padding:16px;border-radius:6px;position:relative;overflow:hidden}
  header::before{content:"⚙";position:absolute;right:-24px;top:-34px;font-size:130px;opacity:.06;color:var(--brass)}
  .kicker{color:var(--red);font-size:11px;letter-spacing:.25em}
  h1{font-size:26px;letter-spacing:.06em;margin-top:2px}
  h1 span{color:var(--brass)}
  #status{height:20px;overflow:hidden;color:var(--dim);font-size:12.5px;letter-spacing:.08em;margin-top:6px;white-space:nowrap}
  #status.err{color:var(--red)}
  #status.on{color:var(--green)}

  .card{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:14px;margin-top:12px}
  label.head{display:block;font-size:11px;letter-spacing:.22em;color:var(--red);margin-bottom:8px}
  label.head::before{content:"++ ";color:var(--faint)}
  label.head::after{content:" ++";color:var(--faint)}

  #msg{
    width:100%;height:84px;resize:none;background:var(--bg);color:var(--bone);
    border:1px solid var(--line);border-radius:6px;padding:10px 12px;
    font-family:var(--mono);font-size:15px;line-height:1.45;outline:none;
  }
  #msg:focus{border-color:var(--brass)}
  .meta-row{display:flex;justify-content:flex-end;height:18px;margin-top:4px}
  #count{font-size:11px;color:var(--faint);width:70px;text-align:right}

  .modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .mode{
    border:1px solid var(--line);border-radius:999px;background:var(--panel2);
    color:var(--dim);font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;
    padding:11px 4px;cursor:pointer;text-align:center;
  }
  .mode small{display:block;font-size:9.5px;color:var(--faint);letter-spacing:.04em}
  .mode[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
  .mode[aria-pressed="true"] small{color:#f3c9c2}
  .mode:active{transform:translateY(1px)}

  .dial-row{display:flex;align-items:center;gap:12px}
  .dial-row label{font-size:11px;letter-spacing:.14em;color:var(--dim);flex:0 0 auto}
  #corr{flex:1;appearance:none;-webkit-appearance:none;height:30px;background:transparent;cursor:pointer}
  #corr::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red-dim),var(--red));border:1px solid var(--line)}
  #corr::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:999px;background:var(--brass);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--brass)}
  #corr::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red-dim),var(--red));border:1px solid var(--line)}
  #corr::-moz-range-thumb{width:24px;height:24px;border-radius:999px;background:var(--brass);border:2px solid var(--bg)}
  #corrv{width:44px;text-align:right;color:var(--brass);font-size:13px;flex:0 0 auto}

  .btn{
    display:block;width:100%;border-radius:999px;cursor:pointer;font-family:var(--mono);
    border:1px solid var(--red);background:var(--red);color:#fff;
    font-size:16px;letter-spacing:.18em;padding:0;height:54px;margin-top:12px;
  }
  .btn:active{transform:translateY(1px)}
  .btn.stop{background:var(--panel2);border-color:var(--brass);color:var(--brass)}
  .row2{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
  .btn2{
    border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:999px;
    font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;height:42px;cursor:pointer;
  }
  .btn2.ready{border-color:var(--brass);color:var(--brass)}
  .btn2:active{transform:translateY(1px)}

  .vizbox{position:relative;height:96px;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden;margin-top:12px}
  #viz{position:absolute;inset:0;width:100%;height:100%;display:block}
  #vizlabel{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--faint);font-size:11px;letter-spacing:.3em;pointer-events:none;transition:opacity .25s;
  }
  .vizbox.live #vizlabel{opacity:0}

  #readout{
    height:118px;overflow-y:auto;background:var(--bg);
    border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:8px;
    font-size:12.5px;color:var(--red);line-height:1.6;word-break:break-word;
  }
  #readout .lit{color:var(--bone)}
  #readout .hdr{color:var(--brass);letter-spacing:.12em}
  #readout .dimline{color:var(--faint)}

  footer{text-align:center;color:var(--faint);font-size:10px;letter-spacing:.28em;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">ADEPTUS MECHANICUS · FIELD UNIT</div>
    <h1>VOX-<span>CASTER</span></h1>
    <div id="status" class="err">MACHINE SPIRIT DORMANT — CODE BLOCKED</div>
  </header>

  <div class="card">
    <label class="head" for="msg">MESSAGE FOR TRANSMISSION</label>
    <textarea id="msg" maxlength="240" spellcheck="false">Praise the Omnissiah. The flesh is weak.</textarea>
    <div class="meta-row"><span id="count">0 / 240</span></div>
  </div>

  <div class="card">
    <label class="head">TRANSMISSION MODE</label>
    <div class="modes" role="group" aria-label="Transmission mode">
      <button class="mode" id="m-screech" aria-pressed="true">SCREECH<small>binharic blurt</small></button>
      <button class="mode" id="m-chant" aria-pressed="false">CHANT<small>canticle</small></button>
      <button class="mode" id="m-voxcast" aria-pressed="false">VOX-CAST<small>hybrid</small></button>
    </div>
  </div>

  <div class="card">
    <div class="dial-row">
      <label for="corr">CORRUPTION</label>
      <input type="range" id="corr" min="0" max="100" value="55" aria-label="Corruption amount">
      <span id="corrv">55</span>
    </div>
  </div>

  <button class="btn" id="transmit">⛧ &nbsp;TRANSMIT</button>
  <div class="row2">
    <button class="btn2" id="save" disabled>SAVE AUDIO (.WAV)</button>
  </div>

  <div class="vizbox" id="vizbox">
    <canvas id="viz"></canvas>
    <div id="vizlabel">AWAITING TRANSMISSION</div>
  </div>
  <div id="readout"><span class="dimline">— no transmission yet —</span></div>

  <footer>++ THE OMNISSIAH HEARS ALL FREQUENCIES ++</footer>
</div>

<script>
'use strict';
/* ============================================================
   VOX-CASTER v0 — text → Adeptus Mechanicus transmission audio
   Screech = real data: UART-style framing over 2-tone FSK
   (14-bit alternating preamble, then per byte: start bit 0,
   8 data bits LSB-first, stop bit 1). f0=2080Hz, f1=3260Hz,
   16ms/bit. Interstitial shrieks sit in gaps BETWEEN bytes so
   a future v1 decoder can ignore them. Deterministic: same
   message + mode + corruption → identical audio.
   ============================================================ */

// ---------- tiny deterministic RNG ----------
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let s=seed>>>0||1;return function(){s^=s<<13;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}

// ---------- liturgy recast (lexicon + honorific) ----------
const LEX=[
  ["i\\s*am|i'm|\\bim\\b","this vessel is"],
  ["\\bi\\b","this adept"],["\\bmy\\b","this adept's"],["\\bme\\b","this adept"],
  ["\\byou\\b","fellow adept"],["\\byour\\b","the adept's"],
  ["\\bhello\\b|\\bhi\\b|\\bhey\\b","salutations"],
  ["\\bfood\\b","nutrient-paste"],["\\beat(ing)?\\b","process nutrients"],
  ["\\bfriends\\b","fellow adepts"],["\\bfriend\\b","fellow adept"],
  ["\\bpeople\\b|\\beveryone\\b","the organics"],
  ["\\bbody\\b","vessel"],["\\bbrain\\b|\\bmind\\b","organic cogitator"],
  ["\\bcomputer\\b|\\blaptop\\b|\\bpc\\b","cogitator"],["\\bphone\\b","vox-caster"],
  ["\\bfix(ing)?\\b|\\brepair(ing)?\\b","perform the rites of maintenance on"],
  ["\\bbroken\\b","stricken by machine-wrath"],
  ["\\bcar\\b","motive unit"],["\\bsleep(ing)?\\b","enter dormancy"],
  ["\\btired\\b","low on sacred power"],["\\bwork(ing)?\\b","labour for the Omnissiah"],
  ["\\bboss\\b","archmagos"],["\\bmusic\\b","the canticles"],
  ["\\bgood\\b|\\bgreat\\b|\\bawesome\\b|\\bcool\\b","blessed"],
  ["\\bbad\\b|\\bterrible\\b","heretical"],
  ["\\byes\\b|\\byeah\\b|\\bok\\b|\\bokay\\b","affirmative"],["\\bno\\b|\\bnope\\b","negative"],
  ["\\bgod\\b","the Omnissiah"],["\\blove\\b","hold in highest devotion"],
  ["\\bhate\\b","abhor as tech-heresy"],["\\bmoney\\b|\\bcash\\b","tithes"],
  ["\\bdoctor\\b","medicae"],["\\bwater\\b","blessed coolant"],
  ["\\bcoffee\\b|\\btea\\b","stimm-brew"],["\\bbeer\\b|\\bwine\\b","sacramental fuel"],
  ["\\bhome\\b|\\bhouse\\b","sanctum"],["\\bwant\\b|\\bneed\\b","require"],
  ["\\bthink(ing)?\\b","cogitate"],["\\bknow\\b","hold in memory-banks"],
  ["\\btalk(ing)?\\b|\\bspeak(ing)?\\b","vox"],["\\blook\\b|\\bsee\\b|\\bwatch\\b","auspex-scan"],
  ["\\bold\\b","venerable"],["\\bnew\\b","newly consecrated"],
  ["\\bdead\\b","returned to the Machine-God"],["\\bkill(ing)?\\b","terminate"],
  ["\\bangry\\b|\\bmad\\b","wrathful"],["\\bhappy\\b|\\bglad\\b","blessed with function"],
  ["\\bsorry\\b","penitence is offered"],["\\bthanks\\b|\\bthank\\b","gratitude-protocol"],
  ["\\bplease\\b","by your leave"],["\\bgun\\b|\\bweapon\\b","holy armament"],
  ["\\benemy\\b|\\benemies\\b","the heretek"],["\\bdog\\b|\\bcat\\b|\\bpet\\b","servo-beast"],
  ["\\bgame\\b|\\bgames\\b","tactical simulations"],["\\bnight\\b","the dark cycle"],
  ["\\bmorning\\b|\\bday\\b","the light cycle"]
];
const HONORIFICS=["the flesh is weak.","omnissiah be praised.","glory to the machine-god.","from crude biomass, function."];
function recast(text){
  let t=" "+text.toLowerCase()+" ";
  for(const [p,r] of LEX){ t=t.replace(new RegExp(p,"g")," "+r+" "); }
  t=t.replace(/\s+/g," ").trim();
  if(!/[.!?]$/.test(t)) t+=".";
  t+=" "+HONORIFICS[hash(text)%HONORIFICS.length];
  return t;
}

// ---------- timeline builder (pure & deterministic) ----------
const F0=2080,F1=3260,BIT=0.016;
const SCALE=[73.42,87.31,98.00,110.00,130.81,146.83]; // D2 F2 G2 A2 C3 D3
const FORMANTS={a:[600,1040,2250],e:[400,1620,2400],i:[250,1750,2600],o:[400,750,2400],u:[350,600,2400]};
function vowelOf(s){const m=s.match(/[aeiouy]/);const v=m?m[0]:"o";return v==="y"?"i":v;}
function bytesOf(s){return Array.from(new TextEncoder().encode(s));}

function buildTimeline(text,mode,corr){
  const R=rng(hash(text+"|"+mode+"|"+corr));
  const tl={mode,corr,segs:[],env:[],syls:[],shrieks:[],pings:[],crackles:[],drone:null,dur:0,transcript:"",liturgy:""};
  let t=0.12;

  function screechBlock(str,tt){
    const bytes=bytesOf(str);
    tl.env.push({t:tt,g:0},{t:tt+0.02,g:1});
    for(let i=0;i<14;i++){tl.segs.push({t:tt,f:i%2?F1:F0});tt+=BIT;}
    for(let bi=0;bi<bytes.length;bi++){
      const by=bytes[bi];
      tl.segs.push({t:tt,f:F0});tt+=BIT;                 // start bit
      for(let k=0;k<8;k++){tl.segs.push({t:tt,f:((by>>k)&1)?F1:F0});tt+=BIT;}
      tl.segs.push({t:tt,f:F1});tt+=BIT;                 // stop bit
      if(bi%7===6&&bi<bytes.length-1){                    // shriek in the gap
        tl.env.push({t:tt,g:1},{t:tt+0.01,g:0});
        const gap=0.09+R()*0.07;
        tl.shrieks.push({t:tt+0.012,d:gap,f:2800+R()*1400});
        tt+=gap+0.03;
        tl.env.push({t:tt,g:0},{t:tt+0.01,g:1});
      }
    }
    tl.env.push({t:tt,g:1},{t:tt+0.03,g:0});
    return tt+0.08;
  }

  function chantBlock(part,tt){
    const words=part.toLowerCase().replace(/[^a-z' ]+/g," ").trim().split(/\s+/).filter(Boolean);
    for(let wi=0;wi<words.length;wi++){
      const w=words[wi];
      const sylls=w.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]+$)?/g)||[w];
      for(let si=0;si<sylls.length;si++){
        if(tl.syls.length>=90) return tt;
        const last=(wi===words.length-1&&si===sylls.length-1);
        const d=last?0.55+R()*0.12:0.26+R()*0.10;
        const f=last?SCALE[0]:SCALE[Math.floor(R()*SCALE.length)];
        tl.syls.push({t:tt,d,f,v:vowelOf(sylls[si])});
        tt+=d+0.02;
      }
      tt+=0.03;
    }
    tl.pings.push({t:tt+0.04});
    return tt+0.28;
  }

  if(mode==="screech"){
    t=screechBlock(text,t);
    const bytes=bytesOf(text);
    const bin=bytes.slice(0,8).map(b=>b.toString(2).padStart(8,"0")).join(" ");
    tl.transcript=bin+(bytes.length>8?" …":"")+"  ["+bytes.length+" bytes cast]";
  }else if(mode==="chant"){
    tl.liturgy=recast(text);
    tl.drone={t0:0.05,t1:0};
    t=chantBlock(tl.liturgy,t);
    tl.drone.t1=t;
    tl.transcript=tl.liturgy;
  }else{ // voxcast
    tl.liturgy=recast(text);
    tl.drone={t0:0.05,t1:0};
    const phrases=tl.liturgy.split(/[.,;:!?]+/).map(s=>s.trim()).filter(Boolean);
    const parts=[];
    for(const ph of phrases){
      t=chantBlock(ph,t);
      parts.push(ph);
      const burst=ph.slice(0,14);
      t=screechBlock(burst,t+0.06)+0.06;
      parts.push("▚▞▚▞▞▚▞▚");
    }
    tl.drone.t1=t;
    tl.transcript=parts.join("  ·  ");
  }

  // corruption bed: crackle ticks scattered through the transmission
  const n=Math.min(70,Math.floor(t*corr/26));
  for(let i=0;i<n;i++){
    tl.crackles.push({t:0.1+R()*(t-0.2),d:0.005+R()*0.012,g:(0.05+R()*0.16)*(corr/100)});
  }
  tl.dur=t+(mode==="screech"?0.5:1.7);
  return tl;
}

// ---------- audio realization (shared by live + offline) ----------
function driveCurve(k){
  const n=1024,c=new Float32Array(n),norm=Math.tanh(k);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(k*x)/norm;}
  return c;
}
function makeNoiseBuf(ctx,dur,R){
  const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=R()*2-1;
  return buf;
}
function makeImpulse(ctx,dur,decay,R){
  const len=Math.floor(ctx.sampleRate*dur);
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,decay);
  return buf;
}

function realize(ctx,tl,dest,collect,t0){
  const R=rng(hash("fx|"+tl.mode+"|"+tl.corr)); // deterministic fx randomness
  const corr=tl.corr/100;
  const master=ctx.createGain();master.gain.value=0.9;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-14;comp.ratio.value=6;comp.attack.value=0.004;comp.release.value=0.2;
  master.connect(comp);comp.connect(dest);

  const start=(node,at,stopAt)=>{node.start(at);if(stopAt)node.stop(stopAt);collect.push(node);};

  // ---- SCREECH voice ----
  if(tl.segs.length){
    const osc=ctx.createOscillator();osc.type="square";
    const lfo=ctx.createOscillator();lfo.frequency.value=5.5;
    const lfoG=ctx.createGain();lfoG.gain.value=corr*40;         // detune warble (cents)
    lfo.connect(lfoG);lfoG.connect(osc.detune);
    const drive=ctx.createWaveShaper();drive.curve=driveCurve(1.5+corr*5);drive.oversample="2x";
    const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=2700;bp.Q.value=0.5;
    const g=ctx.createGain();g.gain.value=0;
    osc.connect(drive);drive.connect(bp);bp.connect(g);g.connect(master);
    for(const s of tl.segs)osc.frequency.setValueAtTime(s.f,t0+s.t);
    g.gain.setValueAtTime(0,t0);
    for(const e of tl.env){g.gain.linearRampToValueAtTime(e.g*0.22,t0+e.t);}
    const end=tl.segs[tl.segs.length-1].t+0.3;
    start(osc,t0,t0+end);start(lfo,t0,t0+end);
  }

  // ---- shrieks ----
  for(const sh of tl.shrieks){
    const o=ctx.createOscillator();o.type="sawtooth";
    o.frequency.setValueAtTime(sh.f+1000,t0+sh.t);
    o.frequency.exponentialRampToValueAtTime(Math.max(300,sh.f-1500),t0+sh.t+sh.d);
    const g=ctx.createGain();g.gain.setValueAtTime(0,t0+sh.t);
    g.gain.linearRampToValueAtTime(0.10+corr*0.08,t0+sh.t+0.015);
    g.gain.linearRampToValueAtTime(0,t0+sh.t+sh.d);
    o.connect(g);g.connect(master);
    start(o,t0+sh.t,t0+sh.t+sh.d+0.05);
  }

  // ---- CHANT voices (2 detuned stacks through formant filters) ----
  if(tl.syls.length){
    const chantBus=ctx.createGain();chantBus.gain.value=1;

    function stack(detune,offset){
      const oA=ctx.createOscillator();oA.type="sawtooth";
      const oB=ctx.createOscillator();oB.type="sawtooth";oB.detune.value=7+detune;
      oA.detune.value=detune;
      const sub=ctx.createOscillator();sub.type="sine";
      const pre=ctx.createGain();pre.gain.value=0.9;
      oA.connect(pre);oB.connect(pre);
      const env=ctx.createGain();env.gain.value=0;
      const GAINS=[1,0.55,0.22];
      const filts=[0,1,2].map(i=>{
        const f=ctx.createBiquadFilter();f.type="bandpass";f.Q.value=9;
        const fg=ctx.createGain();fg.gain.value=GAINS[i];
        pre.connect(f);f.connect(fg);fg.connect(env);
        return f;
      });
      const subG=ctx.createGain();subG.gain.value=0.16;
      sub.connect(subG);subG.connect(env);
      env.connect(chantBus);
      let endT=0;
      for(const s of tl.syls){
        const tt=t0+s.t+offset,d=s.d,fm=FORMANTS[s.v]||FORMANTS.o;
        oA.frequency.setTargetAtTime(s.f,tt,0.02);
        oB.frequency.setTargetAtTime(s.f,tt,0.02);
        sub.frequency.setTargetAtTime(s.f/2,tt,0.02);
        filts.forEach((f,i)=>f.frequency.setTargetAtTime(fm[i],tt,0.02));
        env.gain.setValueAtTime(0.0001,tt);
        env.gain.linearRampToValueAtTime(0.15,tt+0.06);
        env.gain.setValueAtTime(0.15,tt+Math.max(0.07,d-0.09));
        env.gain.linearRampToValueAtTime(0.0001,tt+d);
        endT=Math.max(endT,s.t+d+offset);
      }
      [oA,oB,sub].forEach(o=>start(o,t0,t0+endT+0.4));
    }
    stack(0,0);stack(10,0.013);

    // ring modulation for machine-warble
    const rm=ctx.createGain();rm.gain.value=1-(0.18+corr*0.30);
    const rmLfo=ctx.createOscillator();rmLfo.frequency.value=30+corr*26;
    const rmDepth=ctx.createGain();rmDepth.gain.value=0.18+corr*0.30;
    rmLfo.connect(rmDepth);rmDepth.connect(rm.gain);
    const shp=ctx.createWaveShaper();shp.curve=driveCurve(1.2+corr*1.6);
    chantBus.connect(rm);rm.connect(shp);
    // dry + cathedral reverb
    const dry=ctx.createGain();dry.gain.value=0.6;
    const conv=ctx.createConvolver();conv.buffer=makeImpulse(ctx,2.4,2.6,rng(hash("verb")));
    const wet=ctx.createGain();wet.gain.value=0.5;
    shp.connect(dry);dry.connect(master);
    shp.connect(conv);conv.connect(wet);wet.connect(master);
    const lastSyl=tl.syls[tl.syls.length-1];
    start(rmLfo,t0,t0+lastSyl.t+lastSyl.d+2.5);
  }

  // ---- drone (root + fifth under the chant) ----
  if(tl.drone){
    const dg=ctx.createGain();dg.gain.value=0;
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;
    [SCALE[0],SCALE[3]].forEach(f=>{
      const o=ctx.createOscillator();o.type="sawtooth";o.frequency.value=f;
      o.connect(lp);start(o,t0+tl.drone.t0,t0+tl.drone.t1+1.6);
    });
    lp.connect(dg);dg.connect(master);
    dg.gain.setValueAtTime(0,t0+tl.drone.t0);
    dg.gain.linearRampToValueAtTime(0.05,t0+tl.drone.t0+0.7);
    dg.gain.setValueAtTime(0.05,t0+tl.drone.t1);
    dg.gain.linearRampToValueAtTime(0,t0+tl.drone.t1+1.4);
  }

  // ---- phrase-end ping ----
  for(const p of tl.pings){
    const o=ctx.createOscillator();o.type="triangle";o.frequency.value=1180;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.045,t0+p.t);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+p.t+0.3);
    o.connect(g);g.connect(master);
    start(o,t0+p.t,t0+p.t+0.35);
  }

  // ---- static bed + crackle ----
  if(corr>0.02){
    const bed=ctx.createBufferSource();bed.buffer=makeNoiseBuf(ctx,1.2,R);bed.loop=true;
    const bg=ctx.createGain();
    const lvl=corr*(tl.mode==="screech"?0.045:0.03);
    bg.gain.setValueAtTime(0,t0);
    bg.gain.linearRampToValueAtTime(lvl,t0+0.15);
    bg.gain.setValueAtTime(lvl,t0+tl.dur-0.4);
    bg.gain.linearRampToValueAtTime(0,t0+tl.dur-0.05);
    bed.connect(bg);bg.connect(master);
    start(bed,t0,t0+tl.dur);
  }
  for(const c of tl.crackles){
    const s=ctx.createBufferSource();s.buffer=makeNoiseBuf(ctx,c.d,R);
    const g=ctx.createGain();g.gain.value=c.g;
    s.connect(g);g.connect(master);
    start(s,t0+c.t,t0+c.t+c.d+0.01);
  }
}

// ---------- WAV encoding ----------
function bufferToWav(buf){
  const n=buf.length,sr=buf.sampleRate,data=buf.getChannelData(0);
  const out=new ArrayBuffer(44+n*2),v=new DataView(out);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");v.setUint32(4,36+n*2,true);ws(8,"WAVE");ws(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  ws(36,"data");v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const x=Math.max(-1,Math.min(1,data[i]));v.setInt16(44+i*2,x<0?x*32768:x*32767,true);}
  return new Blob([out],{type:"audio/wav"});
}

// ---------- UI wiring ----------
const $=id=>document.getElementById(id);
const msgEl=$("msg"),countEl=$("count"),corrEl=$("corr"),corrvEl=$("corrv"),
      statusEl=$("status"),transmitBtn=$("transmit"),saveBtn=$("save"),
      readout=$("readout"),vizbox=$("vizbox"),viz=$("viz");
let AC=null,analyser=null,mode="screech",playing=false,activeSources=[],endTimer=null,rafId=null,lastCast=null;

function setStatus(txt,cls){statusEl.textContent=txt;statusEl.className=cls||"";}
// iOS: ask for "playback" audio so the ring/silent switch doesn't mute us (iOS 17+)
function enablePlaybackSession(){try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}}
enablePlaybackSession();
// iOS unlock trick: a 1-sample silent clip inside the tap gesture fully wakes audio
function unlock(ctx){try{const b=ctx.createBuffer(1,1,22050);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);s.start(0);}catch(e){}}
// surface runtime errors on the status line so failures are visible, never silent
window.addEventListener("error",e=>setStatus(("MACHINE SPIRIT ERROR: "+(e.message||"?")).slice(0,64),"err"));
window.addEventListener("unhandledrejection",e=>setStatus(("MACHINE SPIRIT ERROR: "+((e.reason&&e.reason.message)||e.reason||"?")).slice(0,64),"err"));
function updateCount(){countEl.textContent=msgEl.value.length+" / 240";}
msgEl.addEventListener("input",updateCount);updateCount();
corrEl.addEventListener("input",()=>{corrvEl.textContent=corrEl.value;});

["screech","chant","voxcast"].forEach(m=>{
  $("m-"+m).addEventListener("click",()=>{
    mode=m;
    ["screech","chant","voxcast"].forEach(x=>$("m-"+x).setAttribute("aria-pressed",x===m?"true":"false"));
  });
});

function showTranscript(tl){
  const modeName={screech:"BINHARIC BLURT",chant:"CANTICLE",voxcast:"VOX-CAST"}[tl.mode];
  let html='<span class="hdr">++ '+modeName+" · CORRUPTION "+tl.corr+" ++</span><br>";
  if(tl.mode==="screech")html+=tl.transcript;
  else if(tl.mode==="chant")html+='<span class="lit">'+tl.transcript+"</span>";
  else html+='<span class="lit">'+tl.transcript+"</span>";
  html+='<br><span class="dimline">++ END VOX ++</span>';
  readout.innerHTML=html;
}

function drawViz(){
  const c=viz.getContext("2d"),W=viz.width=viz.clientWidth*devicePixelRatio,H=viz.height=viz.clientHeight*devicePixelRatio;
  const bars=48,arr=new Uint8Array(analyser.frequencyBinCount);
  function frame(){
    rafId=requestAnimationFrame(frame);
    analyser.getByteFrequencyData(arr);
    c.clearRect(0,0,W,H);
    const bw=W/bars;
    for(let i=0;i<bars;i++){
      const idx=Math.floor(i/bars*arr.length*0.7);
      const h=(arr[idx]/255)*H*0.92;
      c.fillStyle=h>H*0.6?"#d9a35b":"#c2372e";
      c.fillRect(i*bw+bw*0.18,H-h,bw*0.64,h);
    }
  }
  frame();
}
function stopViz(){if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  const c=viz.getContext("2d");c.clearRect(0,0,viz.width,viz.height);vizbox.classList.remove("live");}

function stopTransmission(){
  if(endTimer){clearTimeout(endTimer);endTimer=null;}
  activeSources.forEach(s=>{try{s.stop();}catch(e){}});
  activeSources=[];
  playing=false;
  transmitBtn.textContent="⛧  TRANSMIT";
  transmitBtn.classList.remove("stop");
  stopViz();
  setStatus("TRANSMISSION SILENCED","");
}

// tap beacon: proves the press reached the button even if later steps fail
transmitBtn.addEventListener("pointerdown",()=>{if(!playing)setStatus("SIGNAL RECEIVED…","on");});
transmitBtn.addEventListener("click",async()=>{
  if(playing){stopTransmission();return;}
  const text=msgEl.value.trim();
  if(!text){setStatus("NO MESSAGE. THE MACHINE SPIRIT AWAITS.","err");return;}
  try{
    enablePlaybackSession();
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      analyser=AC.createAnalyser();analyser.fftSize=512;analyser.connect(AC.destination);}
    unlock(AC);
    if(AC.state!=="running"){try{await AC.resume();}catch(e){}}
    if(AC.state==="suspended"){setStatus("AUDIO LOCKED BY DEVICE — TAP AGAIN","err");return;}
    const corr=parseInt(corrEl.value,10);
    const tl=buildTimeline(text,mode,corr);
    lastCast={text,mode,corr};
    activeSources=[];
    realize(AC,tl,analyser,activeSources,AC.currentTime+0.08);
    playing=true;
    transmitBtn.textContent="■  SILENCE";
    transmitBtn.classList.add("stop");
    vizbox.classList.add("live");
    drawViz();
    showTranscript(tl);
    setStatus("TRANSMITTING ++","on");
    saveBtn.disabled=false;saveBtn.classList.add("ready");
    endTimer=setTimeout(()=>{
      playing=false;activeSources=[];
      transmitBtn.textContent="⛧  TRANSMIT";
      transmitBtn.classList.remove("stop");
      stopViz();
      setStatus("TRANSMISSION COMPLETE","");
    },(tl.dur+0.4)*1000);
  }catch(e){
    setStatus("MACHINE SPIRIT DISPLEASED — RETRY","err");
    console.error(e);
  }
});

// ---------- offline render + save ----------
function renderOffline(text,m,corr){
  const tl=buildTimeline(text,m,corr);
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const octx=new OAC(1,Math.ceil((tl.dur+0.4)*44100),44100);
  realize(octx,tl,octx.destination,[],0.05);
  const p=octx.startRendering();
  if(p&&p.then)return p;
  return new Promise(res=>{octx.oncomplete=e=>res(e.renderedBuffer);});
}
saveBtn.addEventListener("click",async()=>{
  if(!lastCast||saveBtn.disabled)return;
  saveBtn.textContent="FORGING…";
  try{
    const buf=await renderOffline(lastCast.text,lastCast.mode,lastCast.corr);
    const blob=bufferToWav(buf);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="vox-cast-"+lastCast.mode+".wav";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    setStatus("AUDIO RELIC FORGED","on");
  }catch(e){setStatus("FORGING FAILED — RETRY","err");console.error(e);}
  saveBtn.textContent="SAVE AUDIO (.WAV)";
});

// ---------- boot litany ----------
const BOOT=["RITE OF ACTIVATION…","MACHINE SPIRIT: APPEASED","AWAITING INPUT"];
BOOT.forEach((line,i)=>setTimeout(()=>setStatus(line,i===2?"":"on"),450*i));

// ---------- test hooks (harmless in normal use) ----------
window.__test={buildTimeline,renderOffline,
  peak:async(text,m,corr)=>{const b=await renderOffline(text,m,corr);
    const d=b.getChannelData(0);let p=0;for(let i=0;i<d.length;i+=7)p=Math.max(p,Math.abs(d[i]));
    return {dur:b.duration,peak:p};}};
</script>
